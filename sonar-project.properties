sonar.projectKey=crd10lop_axioma-h-engine
sonar.organization=cristian-diez
sonar.projectName=axioma-h-engine
sonar.sources=backend,frontend,scripts
sonar.tests=tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=coverage.xml
# frontend/app.py es la capa de presentación Streamlit y scripts/ contiene la verificación
# del despliegue; ambos se validan ejecutándolos y no forman parte de la cobertura.
sonar.coverage.exclusions=frontend/app.py,scripts/**
